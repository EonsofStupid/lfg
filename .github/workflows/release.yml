name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Derive release metadata
        id: meta
        run: |
          echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "revision=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "created=$(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> "$GITHUB_OUTPUT"

      - name: Build release image
        run: |
          docker build \
            --build-arg BUILD_VERSION=${{ steps.meta.outputs.version }} \
            --build-arg BUILD_REVISION=${{ steps.meta.outputs.revision }} \
            --build-arg BUILD_CREATED=${{ steps.meta.outputs.created }} \
            -t lfg:${{ steps.meta.outputs.version }} .

      - name: Export image archive
        run: |
          docker save lfg:${{ steps.meta.outputs.version }} -o lfg-${{ steps.meta.outputs.version }}.tar
          sha256sum lfg-${{ steps.meta.outputs.version }}.tar > lfg-${{ steps.meta.outputs.version }}.tar.sha256

      - name: Generate release SBOM
        uses: anchore/sbom-action@v0
        with:
          image: lfg:${{ steps.meta.outputs.version }}
          format: spdx-json
          output-file: lfg-${{ steps.meta.outputs.version }}.spdx.json

      - name: Enforce SBOM drift policy
        run: python3 scripts/validate-sbom-policy.py --sbom lfg-${{ steps.meta.outputs.version }}.spdx.json --policy security/sbom-policy.json

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign release artifacts with cosign
        run: |
          cosign sign-blob --yes \
            --output-signature lfg-${{ steps.meta.outputs.version }}.tar.sig \
            --output-certificate lfg-${{ steps.meta.outputs.version }}.tar.pem \
            lfg-${{ steps.meta.outputs.version }}.tar
          cosign sign-blob --yes \
            --output-signature lfg-${{ steps.meta.outputs.version }}.spdx.json.sig \
            --output-certificate lfg-${{ steps.meta.outputs.version }}.spdx.json.pem \
            lfg-${{ steps.meta.outputs.version }}.spdx.json

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            lfg-${{ steps.meta.outputs.version }}.tar
            lfg-${{ steps.meta.outputs.version }}.tar.sha256
            lfg-${{ steps.meta.outputs.version }}.spdx.json
            lfg-${{ steps.meta.outputs.version }}.tar.sig
            lfg-${{ steps.meta.outputs.version }}.tar.pem
            lfg-${{ steps.meta.outputs.version }}.spdx.json.sig
            lfg-${{ steps.meta.outputs.version }}.spdx.json.pem
