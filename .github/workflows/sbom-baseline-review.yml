name: SBOM Baseline Review

on:
  pull_request:
    paths:
      - Dockerfile
      - scripts/validate-sbom-policy.py
      - scripts/refresh-sbom-policy-baseline.py
      - ci/reclaim-hosted-sdk-space.sh
      - security/sbom-policy.json
      - .github/workflows/sbom-baseline-review.yml
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Local image tag to build for review"
        required: false
        default: "lfg:baseline-review"
      build_version:
        description: "Version label to stamp on the review image"
        required: false
        default: "baseline-review"

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    env:
      IMAGE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.image_tag || format('lfg:pr-{0}', github.event.pull_request.number) }}
      BUILD_VERSION: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.build_version || format('pr-{0}', github.event.pull_request.number) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reclaim unused SDK space on the disposable hosted runner
        shell: bash
        run: bash ci/reclaim-hosted-sdk-space.sh

      - name: Derive build metadata
        id: meta
        run: |
          echo "revision=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "created=$(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> "$GITHUB_OUTPUT"

      - name: Build review image
        run: |
          docker build \
            --build-arg BUILD_VERSION=${{ env.BUILD_VERSION }} \
            --build-arg BUILD_REVISION=${{ steps.meta.outputs.revision }} \
            --build-arg BUILD_CREATED=${{ steps.meta.outputs.created }} \
            -t ${{ env.IMAGE_TAG }} .

      - name: Generate review SBOM (SPDX JSON)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE_TAG }}
          format: spdx-json
          output-file: sbom-review.spdx.json

      - name: Validate current SBOM policy gate
        run: |
          python3 scripts/validate-sbom-policy.py \
            --sbom sbom-review.spdx.json \
            --policy security/sbom-policy.json

      - name: Produce baseline refresh dry-run report
        run: |
          python3 scripts/refresh-sbom-policy-baseline.py \
            --sbom sbom-review.spdx.json \
            --policy security/sbom-policy.json \
            > sbom-baseline-dry-run-report.json
          cat sbom-baseline-dry-run-report.json >> "$GITHUB_STEP_SUMMARY"

      - name: Post PR SBOM baseline summary
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- lfg-sbom-baseline-review -->';
            const report = JSON.parse(fs.readFileSync('sbom-baseline-dry-run-report.json', 'utf8'));
            const body = `${marker}
            ## SBOM Baseline Dry-Run

            - Baseline package count: **${report.currentBaselinePackageCount}**
            - Proposed package count: **${report.proposedBaselinePackageCount}**
            - Delta: **${report.delta}**
            - Write requested: **${report.writeRequested}**

            _This is a dry-run only. No policy file was changed by this workflow._`;

            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body
              });
            }

      - name: Upload review artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sbom-baseline-review
          path: |
            sbom-review.spdx.json
            sbom-baseline-dry-run-report.json
