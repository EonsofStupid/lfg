name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo check
        run: cargo check --workspace --locked

      - name: Cargo test
        run: cargo test --workspace --locked

  python-ml:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ML requirements
        run: python -m pip install -r ml/lfg-encoder/requirements.txt

      - name: Validate Python scripts syntax
        run: python -m py_compile ml/lfg-encoder/train.py ml/lfg-encoder/distill.py

      - name: Run Python tests
        run: python -m unittest discover -s ml/lfg-encoder -p 'test_*.py'

      - name: Validate classifier dataset
        run: python ml/lfg-encoder/train.py validate

      - name: Validate distill CLI
        run: python ml/lfg-encoder/distill.py --help

      - name: Validate a temporary distill template
        run: |
          python ml/lfg-encoder/distill.py init-template --output "$RUNNER_TEMP/lfg-trace-template.jsonl"
          python ml/lfg-encoder/distill.py validate-traces --traces "$RUNNER_TEMP/lfg-trace-template.jsonl"

  ui:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build UI
        run: |
          cd ui/master-clyffy-web
          npm ci
          npm run build

  container:
    runs-on: ubuntu-latest
    needs:
      - rust
      - python-ml
      - ui
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Derive build metadata
        id: meta
        run: |
          echo "version=ci-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "revision=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "created=$(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> "$GITHUB_OUTPUT"

      - name: Build image
        run: |
          docker build \
            --build-arg BUILD_VERSION=${{ steps.meta.outputs.version }} \
            --build-arg BUILD_REVISION=${{ steps.meta.outputs.revision }} \
            --build-arg BUILD_CREATED=${{ steps.meta.outputs.created }} \
            -t lfg:ci .

      - name: Vulnerability gate (HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: lfg:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "1"

      - name: Verify image labels
        run: docker inspect lfg:ci --format '{{json .Config.Labels}}'

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: lfg:ci
          format: spdx-json
          output-file: lfg-ci.spdx.json

      - name: Enforce SBOM drift policy
        run: python3 scripts/validate-sbom-policy.py --sbom lfg-ci.spdx.json --policy security/sbom-policy.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: lfg-ci-sbom
          path: lfg-ci.spdx.json

      - name: Run container smoke test
        run: |
          docker run -d --rm --name lfg-ci -p 4317:4317 lfg:ci
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4317/health >/tmp/health.json; then
              break
            fi
            sleep 1
          done
          cat /tmp/health.json
          curl -fsS http://127.0.0.1:4317/ >/tmp/index.html
          head -n 3 /tmp/index.html
          docker run --rm --entrypoint python3 lfg:ci /opt/lfg/ml/lfg-encoder/distill.py --help
          docker stop lfg-ci
